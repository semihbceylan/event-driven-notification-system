server {
    listen 80;
    root /usr/share/nginx/html;

    # Single-page app: unknown paths serve index.html.
    location / {
        try_files $uri /index.html;
    }

    location /v1/ws {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 1h; # the server pings every 30s
    }

    location /v1/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Correlation-ID $request_id;
    }

    location = /docs         { proxy_pass http://api:8080; }
    location = /openapi.yaml { proxy_pass http://api:8080; }

    location /worker/ { proxy_pass http://worker:9091/; }
    location /mock/   { proxy_pass http://mockprovider:8090/; }
}
