# Scrapes the API (HTTP metrics, live queue depth) and the worker (delivery
# outcomes, provider latency, rate-limit waits, circuit breaker state).
global:
  scrape_interval: 5s

scrape_configs:
  - job_name: api
    static_configs:
      - targets: ["api:8080"]
  - job_name: worker
    static_configs:
      - targets: ["worker:9091"]
