name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Go lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "Run gofmt on:"; echo "$unformatted"; exit 1; fi
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

  test:
    name: Go tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # Integration tests start Postgres and Redis with testcontainers,
      # using the Docker daemon that GitHub's Ubuntu runners provide.
      - run: go test -race -count=1 -coverprofile=coverage.out ./...
      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1

  web:
    name: Dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build # includes the vue-tsc type check

  e2e:
    name: End-to-end (docker compose)
    runs-on: ubuntu-latest
    needs: [test, web]
    steps:
      - uses: actions/checkout@v7
      - name: Start the stack
        run: docker compose up -d --build --wait
      - name: Smoke test
        run: ./scripts/smoke.sh
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail=200 api worker mockprovider
      - name: Stop
        if: always()
        run: docker compose down -v
