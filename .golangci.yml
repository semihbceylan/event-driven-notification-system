version: "2"

linters:
  # errcheck, govet, ineffassign, staticcheck, unused
  default: standard
  enable:
    - bodyclose     # HTTP response bodies are closed
    - errorlint     # errors are compared with errors.Is/As, so wrapping keeps working
    - misspell
    - noctx         # outgoing HTTP requests carry a context
  exclusions:
    presets:
      - std-error-handling # e.g. unchecked Close() in defers
    rules:
      - path: _test\.go
        linters: [bodyclose, noctx]

formatters:
  enable:
    - gofmt
