services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: notify
      POSTGRES_PASSWORD: notify
      POSTGRES_DB: notify
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notify -d notify"]
      interval: 2s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20

  # Stands in for webhook.site so everything runs offline.
  # Set PROVIDER_URL to your webhook.site URL to use the real one.
  mockprovider:
    build: .
    command: ["mockprovider"]
    environment:
      FAILURE_RATE: ${MOCK_FAILURE_RATE:-0.1}
      LATENCY: ${MOCK_LATENCY:-30ms}
    ports:
      - "8090:8090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8090/healthz"]
      interval: 2s
      timeout: 3s
      retries: 20

  api:
    build: .
    command: ["api"]
    environment: &app-env
      DATABASE_URL: postgres://notify:notify@postgres:5432/notify?sslmode=disable
      REDIS_ADDR: redis:6379
      PROVIDER_URL: ${PROVIDER_URL:-http://mockprovider:8090/send}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      RATE_LIMIT_PER_SECOND: ${RATE_LIMIT_PER_SECOND:-100}
      MAX_ATTEMPTS: ${MAX_ATTEMPTS:-5}
      BREAKER_THRESHOLD: ${BREAKER_THRESHOLD:-5}
      BREAKER_COOLDOWN: ${BREAKER_COOLDOWN:-5s}
      BREAKER_MAX_COOLDOWN: ${BREAKER_MAX_COOLDOWN:-1m}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 2s
      timeout: 3s
      retries: 20

  worker:
    build: .
    command: ["worker"]
    environment: *app-env
    ports:
      - "9091:9091" # /healthz, /readyz, /breakers, /metrics
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9091/readyz"]
      interval: 2s
      timeout: 3s
      retries: 20
    depends_on:
      # The API runs the migrations, so the worker waits for it.
      api:
        condition: service_healthy
      mockprovider:
        condition: service_healthy

  dashboard:
    build: ./web
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy
      worker:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - api
      - worker

volumes:
  pgdata:
